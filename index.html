<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Title & Description -->
    <title>Companion — Book Event Tickets & Find Companions in India</title>
    <meta name="description" content="Companion helps you discover and book tickets for movies, concerts, sports and live events across India. Find companions to share unforgettable moments together." />

    <!-- SEO: Open Graph -->
    <meta property="og:title" content="Companion — Book Event Tickets & Find Companions" />
    <meta property="og:description" content="Discover movies, concerts, sports and live events. Book tickets and find companions across India." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />

    <!-- SEO: Additional -->
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="event tickets, book tickets, movies, concerts, sports, live events, India, companion, BookMyShow alternative" />
    <meta name="author" content="Companion" />
    <link rel="canonical" href="https://companion.app/" />

    <!-- Performance: Preconnect -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://checkout.razorpay.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>" />

    <!-- Performance: Theme color -->
    <meta name="theme-color" content="#0b0d12" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
